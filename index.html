<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Lens · SBOM 准入证据链</title><link rel="stylesheet" href="license-lens.css"></head><body><main class="app">
<header class="top">
<div class="brand"><div class="logo">L</div><div><h1>License Lens</h1><small>SBOM 准入证据链 · 批次 / 门禁 / 放行</small></div></div><div class="actions"><button id="reset">重置示例</button><button id="export" class="primary">导出 Markdown</button></div></header>
<section class="summary" id="metrics"></section>
<section class="layout">
<aside>
<div class="panel"><h3>批次时间线</h3><div id="timeline"></div></div>
<div class="panel"><h3>新建批次 / 重检</h3><div class="base-line" id="baseLine"></div><input id="reason" placeholder="批次原因（重检必填）" autocomplete="off"><textarea id="importText" class="textarea" spellcheck="false"></textarea><button id="createBatch" class="primary block">解析并创建批次</button><p class="hint">每行一个组件：<code>名称@版本 许可证 摘要 渠道 用途</code>，后三项可省略。渠道：npm / mirror / vendor / commercial / embedded；用途：runtime / dev / build / test / bundle。相同来源摘要的条目只合并批次关联，不重复建档。重检会按摘要继承基线批次的证据（声明、核验、责任人、期限）。</p><div class="status" id="status"></div></div>
</aside>
<section class="main-col">
<div class="panel" id="batchPanel"></div>
<div class="panel"><h3>组件台帐 · 按来源摘要合并</h3><div id="ledger"></div></div>
</section>
</section>
</main><script src="data.js"></script><script src="rules.js"></script><script src="ui.js"></script></body></html>
